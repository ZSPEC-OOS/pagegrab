<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>PageGrab</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: #1e1f22;
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100%;
  }
  #toolbar {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px;
    background: #2b2d31;
    border-bottom: 1px solid #1b1c1e;
  }
  #toolbar button {
    background: #3c3f45;
    color: #e5e5e5;
    border: 1px solid #4a4d54;
    border-radius: 4px;
    padding: 6px 10px;
    cursor: pointer;
    font-size: 14px;
  }
  #toolbar button:hover { background: #47494f; }
  #toolbar button:disabled { opacity: 0.5; cursor: default; }
  #url {
    flex: 1;
    padding: 6px 10px;
    border-radius: 4px;
    border: 1px solid #4a4d54;
    background: #1e1f22;
    color: #e5e5e5;
    font-size: 14px;
  }
  #capture {
    background: #3b82f6;
    border-color: #3b82f6;
    color: #fff;
    font-weight: 600;
  }
  #capture:hover { background: #2563eb; }
  #status {
    padding: 4px 10px;
    font-size: 12px;
    color: #b5b8bd;
    background: #2b2d31;
    min-height: 16px;
  }
  #view {
    flex: 1;
    background: #fff;
  }
</style>
</head>
<body>
  <div id="app">
    <div id="toolbar">
      <button id="back" title="Back">&#8592;</button>
      <button id="forward" title="Forward">&#8594;</button>
      <button id="reload" title="Reload">&#8635;</button>
      <input id="url" type="text" placeholder="Enter a URL and press Enter" />
      <button id="go">Go</button>
      <button id="capture">Capture Full Page</button>
    </div>
    <div id="status"></div>
    <webview id="view" src="https://www.google.com" allowpopups></webview>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
