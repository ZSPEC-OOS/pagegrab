<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PageGrab</title>
<style>
  body { font: 13px/1.4 system-ui, sans-serif; width: 240px; margin: 0; padding: 12px; color: #1f2328; }
  h1 { font-size: 13px; font-weight: 600; margin: 0 0 8px; }
  label { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 8px; cursor: pointer; }
  label input[type="radio"] { margin-top: 3px; }
  label span.title { display: block; font-weight: 500; }
  label span.desc { display: block; color: #6b7280; font-size: 11px; }
  #inner-picker { margin: 0 0 10px 24px; }
  #inner-picker[hidden] { display: none; }
  #pick-status { color: #6b7280; font-size: 11px; margin-top: 6px; }
  #pick-status button.link {
    all: unset; color: #3b82f6; cursor: pointer; font-size: 11px; text-decoration: underline;
  }
  button {
    width: 100%; margin-top: 4px; padding: 8px; border: none; border-radius: 6px;
    background: #3b82f6; color: #fff; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  button:hover { background: #2563eb; }
  button.secondary {
    background: #fff; color: #3b82f6; border: 1px solid #3b82f6; font-weight: 500;
  }
  button.secondary:hover { background: #eff6ff; }
</style>
</head>
<body>
  <h1>PageGrab</h1>
  <label>
    <input type="radio" name="mode" value="page" checked>
    <span>
      <span class="title">Whole page</span>
      <span class="desc">Scroll &amp; stitch the full document.</span>
    </span>
  </label>
  <label>
    <input type="radio" name="mode" value="inner">
    <span>
      <span class="title">Inner scroll area</span>
      <span class="desc">Capture one scrolling panel only.</span>
    </span>
  </label>
  <div id="inner-picker" hidden>
    <button id="pick" type="button" class="secondary">Pick element on page&hellip;</button>
    <div id="pick-status"></div>
  </div>
  <button id="capture">Capture</button>
  <script src="popup.js"></script>
</body>
</html>
